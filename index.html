<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Tian’s Hens — Paris → Beauvais → Madeira</title>
    <meta
      name="description"
      content="Hen chaos unlocked: spa glow-ups, jazz crawls, levadas, whale boats & a new identity every bar. Tian’s crew — unicorn-grade vibes, zero refunds. 🦄✨"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Tian’s Hens — strap in, it’s giving main-character weekend"
    />
    <meta
      property="og:description"
      content="Hen chaos unlocked: spa glow-ups, jazz crawls, levadas, whale boats & a new identity every bar. Tian’s crew — unicorn-grade vibes, zero refunds. 🦄✨"
    />
    <meta
      property="og:url"
      content="https://charlotte-akasha.github.io/Tian-Hen-s-party/"
    />
    <meta
      property="og:image"
      content="https://charlotte-akasha.github.io/Tian-Hen-s-party/assets/hens-hero-meme.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://charlotte-akasha.github.io/Tian-Hen-s-party/assets/hens-hero-meme.png"
    />
    <meta
      name="twitter:title"
      content="Tian’s Hens — strap in, it’s giving main-character weekend"
    />
    <meta
      name="twitter:description"
      content="Hen chaos unlocked: spa glow-ups, jazz crawls, levadas, whale boats & a new identity every bar. Tian’s crew — unicorn-grade vibes, zero refunds. 🦄✨"
    />

    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>

    <header class="top">
      <div class="container top__inner">
        <div class="brand">
          <div class="brand__badge" aria-hidden="true">🦄</div>
          <div class="brand__text">
            <div class="brand__kicker" id="kicker">Hens weekend</div>
            <div class="brand__title" id="title">Program</div>
          </div>
        </div>

        <div class="actions no-print">
          <button class="btn" type="button" id="copyLinkBtn">
            Copy share text
          </button>
          <button class="btn btn--primary" type="button" id="printBtn">
            Print / Save PDF
          </button>
        </div>
      </div>
    </header>

    <main id="content" class="container">
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero__card">
          <div class="hero__meta">
            <div class="pill" id="datesPill">Dates TBC</div>
            <div class="pill pill--soft" id="locationPill">Location TBC</div>
          </div>
          <h1 class="hero__title" id="heroTitle">Tian’s Hens</h1>
          <p class="hero__subtitle" id="subtitle" hidden></p>

          <figure class="hero__meme">
            <img
              src="./assets/hens-hero-meme.png"
              width="960"
              height="540"
              alt="Playful collage: rainbow unicorn energy, laser eyes, pixel rainbow — hen party mood."
              loading="eager"
              decoding="async"
            />
          </figure>

          <dl class="kv" id="quickFacts"></dl>
        </div>

        <aside class="hero__side">
          <div class="card" id="contactsCard" hidden>
            <h2 class="card__title">Contacts</h2>
            <div class="contacts" id="contacts"></div>
          </div>

          <div class="card">
            <h2 class="card__title">What to bring</h2>
            <ul class="list" id="packingList"></ul>
          </div>
        </aside>
      </section>

      <section class="section" aria-labelledby="scheduleTitle">
        <div class="section__head">
          <h2 class="section__title" id="scheduleTitle">Schedule</h2>
          <p class="section__sub" id="scheduleSubtitle" hidden></p>
        </div>

        <div class="days" id="days"></div>
      </section>

      <section class="section grid2 extras" aria-labelledby="planBTitle">
        <div class="card">
          <h2 class="card__title" id="planBTitle">Plan B</h2>
          <div class="section__sub extras__intro" id="planBIntro"></div>
          <div class="tableWrap" id="planBTable"></div>
        </div>

        <div class="card">
          <h2 class="card__title" id="otherActivitiesTitle">
            Other potential activities
          </h2>
          <div class="tableWrap" id="otherActivities"></div>
        </div>
      </section>

      <footer class="footer" id="siteFooter" hidden>
        <div class="muted small" id="footerNote"></div>
      </footer>
    </main>

    <script src="./content/program-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
