    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Tian’s Hens — Paris → Beauvais → Madeira",
        "url": "https://charlotte-akasha.github.io/Tian-Hen-s-party/",
        "description": "A curated descent into bad ideas, deep friendship and lasting memories"
      }
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
    <!-- Project Pages: lock asset URLs to repo root so ./content/program-data.js always loads -->
    <script>
      (function () {
        if (!location.hostname.endsWith("github.io")) return;
        var parts = location.pathname.split("/").filter(Boolean);
        if (parts.length < 1) return;
        var b = document.createElement("base");
        b.href = location.origin + "/" + parts[0] + "/";
        document.head.insertBefore(b, document.head.children[1] || null);
      })();
    </script>

    <link rel="stylesheet" href="styles.css?v=19" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>

    <header class="top">
      <div class="container top__inner">
        <div class="brand">
          <div class="brand__badge" aria-hidden="true">🦄</div>
          <div class="brand__text">
            <div class="brand__kicker" id="kicker">Hens weekend</div>
            <div class="brand__title" id="title">Program</div>
          </div>
        </div>

        <div class="actions no-print">
          <button class="btn" type="button" id="copyLinkBtn">
            Copy share text
          </button>
          <button class="btn btn--primary" type="button" id="printBtn">
            Print / Save PDF
          </button>
        </div>
      </div>
    </header>

    <main id="content" class="container">
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero__card">
          <div class="hero__meta">
            <div class="pill" id="datesPill">Dates TBC</div>
            <div class="pill pill--soft" id="locationPill">Location TBC</div>
          </div>
          <h1 class="hero__title" id="heroTitle">Tian’s Hens</h1>
          <p class="hero__subtitle" id="subtitle" hidden></p>

          <figure class="hero__meme">
            <picture>
              <source srcset="assets/hens-hero-meme.webp" type="image/webp" />
              <img
                src="assets/hens-hero-meme.png?v=15"
                width="960"
                height="540"
                alt="Playful collage: rainbow unicorn energy, laser eyes, pixel rainbow — hen party mood."
                loading="eager"
                decoding="async"
              />
            </picture>
          </figure>

          <dl class="kv" id="quickFacts"></dl>
        </div>

        <aside class="hero__side">
          <div class="card" id="contactsCard" hidden>
            <h2 class="card__title">Contacts</h2>
            <div class="contacts" id="contacts"></div>
          </div>

          <div class="card">
            <h2 class="card__title">What to bring</h2>
            <ul class="list" id="packingList"></ul>
          </div>
        </aside>
      </section>

      <section class="section" aria-labelledby="scheduleTitle">
        <div class="section__head">
          <h2 class="section__title" id="scheduleTitle">Schedule</h2>
          <p class="section__sub" id="scheduleSubtitle" hidden></p>
        </div>

        <div class="days" id="days"></div>
      </section>

      <section class="section grid2 extras" aria-labelledby="planBTitle">
        <div class="card">
          <h2 class="card__title" id="planBTitle">Plan B</h2>
          <div class="section__sub extras__intro" id="planBIntro"></div>
          <div class="tableWrap" id="planBTable"></div>
        </div>

        <div class="card">
          <h2 class="card__title" id="otherActivitiesTitle">
            Other potential activities
          </h2>
          <div class="tableWrap" id="otherActivities"></div>
        </div>
      </section>

      <footer class="footer" id="siteFooter" hidden>
        <div class="muted small" id="footerNote"></div>
      </footer>
    </main>

    <script src="content/program-data.js?v=29"></script>
    <script src="app.js?v=18"></script>
  </body>
</html>
